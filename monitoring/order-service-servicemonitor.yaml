apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: order-service
  namespace: monitoring

  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - ai-sre

  selector:
    matchLabels:
      app: order-service

  endpoints:
    - port: http
      path: /metrics
      interval: 15s